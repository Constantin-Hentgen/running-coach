services:
  running-coach:
    build: .
    container_name: running_coach_agent
    restart: always
    ports:
      - "18000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - RADICALE_URL=${RADICALE_URL}
      - RADICALE_USER=${RADICALE_USER}
      - RADICALE_PASS=${RADICALE_PASS}
      - DREEVE_API_KEY=${DREEVE_API_KEY}
      - DREEVE_API_URL=${DREEVE_API_URL}